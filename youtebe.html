<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youtube</title>
    <style>
        *{
            margin: 0%;
            padding: 0%;
        }
        ::-webkit-scrollbar{
            width: 0%;
            height: 0%;
        }
        img{
            width: 100vw;
        }
        a{
            display: block;
            background-color: rgb(185, 0, 0);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            text-decoration: none;
        }
        a:hover{
            background-color: rgb(223, 1, 1);
        }
    </style>   
</head>
<body>
    <img src="imagens/tela-youtube.png" alt="">
    <a href="https://www.youtube.com/@cursoemvideo/playlists" target="_blank">Youtube</a>

</html>
